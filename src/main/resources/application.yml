server:
  port: 8080
  shutdown: graceful

spring:
  # Loads .env when present (local `mvn spring-boot:run` outside Docker) so JWT_SECRET,
  # DB_*, MAIL_*, SUPABASE_* resolve without exporting them by hand. "optional:" keeps this
  # a no-op in Docker/CI, where real env vars are already injected and no .env file exists.
  config:
    import: "optional:file:.env[.properties]"
  # `.env` is loaded as a plain .properties file, so its keys stay literally
  # "SPRING_PROFILES_ACTIVE" (uppercase) — unlike a real OS env var, Spring does NOT
  # auto-translate that to "spring.profiles.active" for a file-based source. Without this
  # line, no profile ever activates from .env alone → no datasource configured → app fails
  # to start with "Failed to determine a suitable driver class" (silently, port 8080 never
  # opens). This placeholder reads the literal "SPRING_PROFILES_ACTIVE" key (from .env or a
  # real env var, both work) and falls back to "dev" so a bare `mvn spring-boot:run` always
  # boots correctly.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: portail-adac
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  cookie-secure: ${JWT_COOKIE_SECURE:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Separate from spring.mail.username on purpose: that's the SMTP *login* (a Mailtrap token in
  # dev, defaulting to "" — see application-dev.yml), not necessarily an address the relay will
  # accept as a sender identity. Using it as From would make every activation/reset email fail
  # to send (see TICKET-015 review).
  mail:
    from: ${MAIL_FROM:no-reply@adac.fr}

supabase:
  url: ${SUPABASE_URL:}
  key: ${SUPABASE_KEY:}
  bucket: ${SUPABASE_BUCKET:}

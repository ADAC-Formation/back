springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Hardcoded, not env-driven: the base application.yml already defaults jwt.cookie-secure to
# false for dev. A stray JWT_COOKIE_SECURE in a prod .env must never be able to downgrade this
# and send the jwt cookie over plain HTTP — see TICKET-006 review.
jwt:
  cookie-secure: true

logging:
  level:
    com.adac.portail: INFO

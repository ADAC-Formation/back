spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/adac_portail}
    username: ${DB_USERNAME:adac_user}
    password: ${DB_PASSWORD:adac_password}
  jpa:
    show-sql: true
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # JavaMail defaults these to infinite — a stuck Mailtrap/Brevo connection would pin a
          # request thread forever otherwise (see TICKET-007 review).
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

supabase:
  url: ${SUPABASE_URL:}
  key: ${SUPABASE_KEY:}
  bucket: ${SUPABASE_BUCKET:}

logging:
  level:
    com.adac.portail: DEBUG

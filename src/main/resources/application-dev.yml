spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/adac_portail}
    username: ${DB_USERNAME:adac_user}
    password: ${DB_PASSWORD:adac_password}
  jpa:
    show-sql: true
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.adac.portail: DEBUG

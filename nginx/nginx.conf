server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for: nginx is the only edge (backend has no
        # published port, see docker-compose.yml), so there's exactly one hop and nothing
        # upstream to preserve — $proxy_add_x_forwarded_for APPENDS to whatever X-Forwarded-For
        # the client already sent, which a client can set to anything. That would let an attacker
        # spoof the IP half of the login lockout key (TICKET-045) and bypass it outright.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
